<style>
:root {
  --bg: #0b0c12;
  --surface: #12141d;
  --line: rgba(255, 255, 255, 0.08);
  --ink: #f2f3f7;
  --ink-dim: #a9aebc;
  --amber: #ffb84d;
}
* { box-sizing: border-box; margin: 0; }
body {
  min-height: 100vh; min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
  line-height: 1.6;
}
.cosmos {
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(900px 460px at 78% -10%, rgba(255, 158, 46, 0.13), transparent 60%),
    radial-gradient(760px 520px at -8% 92%, rgba(90, 110, 255, 0.10), transparent 60%),
    var(--bg);
}
.card {
  width: 100%; max-width: 420px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 24px;
  padding: 32px 26px 26px; text-align: center;
}
.icon { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); }
h1 { font-size: 28px; line-height: 1.25; letter-spacing: -0.01em; margin-top: 18px; }
h1 small { display: block; font-size: 14px; font-weight: 500; color: var(--ink-dim); letter-spacing: 0; margin-top: 2px; }
.tagline { font-size: 15.5px; color: var(--amber); font-weight: 500; margin-top: 12px; word-break: keep-all; }
.tagline span { display: block; font-size: 14px; color: var(--ink-dim); font-weight: 400; }
.desc { font-size: 14.5px; color: var(--ink-dim); margin-top: 10px; word-break: keep-all; }
.stores { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
.store-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 54px; padding: 8px 18px;
  border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.18);
  background: #000; color: #fff; text-decoration: none; text-align: left;
}
.store-btn svg { width: 24px; height: 24px; flex-shrink: 0; fill: currentColor; }
.store-btn .txt { display: flex; flex-direction: column; line-height: 1.15; }
.store-btn .txt small { font-size: 10.5px; letter-spacing: 0.04em; opacity: 0.75; }
.store-btn .txt b { font-size: 16px; font-weight: 500; }
a.store-btn:active { border-color: var(--amber); }
.store-btn.soon { opacity: 0.55; cursor: default; }
.store-btn.soon .txt small { color: var(--amber); opacity: 1; }
.more { margin-top: 20px; font-size: 13px; }
.more a { color: var(--ink-dim); text-decoration: none; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>
<div class="cosmos" aria-hidden="true"></div>
<main class="card">
  <picture>
    <source srcset="/assets/skybounce/icon-256.webp 1x, /assets/skybounce/icon-512.webp 2x" type="image/webp">
    <img class="icon" src="/assets/skybounce/icon-256.png" alt="Sky Bounce app icon" width="112" height="112">
  </picture>
  <h1>Sky Bounce<small>Tap &amp; Fly · 스카이 바운스</small></h1>
  <p class="tagline">Cute one-tap jump arcade<span>톡톡 점프! 귀여운 원탭 아케이드</span></p>
  <p class="desc">Tap once and a round little sky spirit bounces up. Glide between the pipes and beat your friend's score.</p>

  <!-- Store buttons: "Coming soon" by default. Flip STORES_LIVE in the script below on launch day. -->
  <div class="stores">
    <span class="store-btn soon" data-store="ios" aria-disabled="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
      <span class="txt"><small>Coming soon · 출시 예정</small><b>App Store</b></span>
    </span>
    <span class="store-btn soon" data-store="android" aria-disabled="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/></svg>
      <span class="txt"><small>Coming soon · 출시 예정</small><b>Google Play</b></span>
    </span>
  </div>

  <p class="more"><a href="/">whyplanet.net</a></p>
</main>
<script>
// ===== Store launch config — flip to true on launch day (same flag as the main site's index.html) =====
// While false, nobody is redirected: an unpublished store listing would be a 404.
const STORES_LIVE = true;   // 2026-10-22: Google Play 공개(1.5.0) · App Store 심사 중 → ios 는 "" 로 「출시 예정」 유지
const STORE_URLS = {
  ios: "",                                                                          // App Store 공개 날 → "https://apps.apple.com/app/id6761355306" (App ID 6761355306)
  android: "https://play.google.com/store/apps/details?id=com.whyplanet.skybounce"  // Google Play
};
// If only one store is live, set the other URL to "" — its button stays "Coming soon" and that platform is not redirected.
// =====================================================================================================

(function () {
  if (!STORES_LIVE) return;

  // Buttons become real links (desktop visitors, and mobile browsers that block the redirect below).
  document.querySelectorAll(".store-btn[data-store]").forEach(function (el) {
    var url = STORE_URLS[el.dataset.store];
    if (!url) return;
    var a = document.createElement("a");
    a.className = "store-btn";
    a.href = url;
    a.rel = "noopener";
    a.innerHTML = el.innerHTML;
    var small = a.querySelector(".txt small");
    if (small) small.textContent = el.dataset.store === "ios" ? "Download on the" : "Get it on";
    el.replaceWith(a);
  });

  // Smart link: send the visitor to the store for their device. Desktop stays on this page.
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  // iPadOS 13+ reports itself as a Mac — tell it apart by touch points.
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var target = isIOS ? STORE_URLS.ios : (isAndroid ? STORE_URLS.android : "");
  if (target) location.replace(target);
})();
</script>
</body>
</html>
